- path: /var/lib/rancher/rke2/server/manifests/post-deploy-manifests/aws_cloud_controller_manager.yaml
  content: |
    ---
    apiVersion: helm.cattle.io/v1
    kind: HelmChart
    metadata:
        name: aws-cloud-controller-manager
        namespace: kube-system
    spec:
        chart: aws-cloud-controller-manager/aws-cloud-controller-manager
        repo: https://kubernetes.github.io/cloud-provider-aws
        targetNamespace: kube-system
        valuesContent: |-
         hostNetworking: true
          tolerations:
            - effect: NoSchedule
              key: node.cloudprovider.kubernetes.io/uninitialized
              value: 'true'
            - effect: NoSchedule
              value: 'true'
              key: node-role.kubernetes.io/control-plane
          nodeSelector:
            node-role.kubernetes.io/control-plane: 'true'
          args:
            - --configure-cloud-routes=false
            - --use-service-account-credentials=true
            - --v=2
            - --cloud-provider=aws
          clusterRoleRules:
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
                - update
            - apiGroups:
                - ""
              resources:
                - nodes
              verbs:
                - '*'
            - apiGroups:
                - ""
              resources:
                - nodes/status
              verbs:
                - patch
            - apiGroups:
                - ""
              resources:
                - services
              verbs:
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - ""
              resources:
                - services/status
              verbs:
                - list
                - patch
                - update
                - watch
            - apiGroups:
               - ''
              resources:
                - serviceaccounts
              verbs:
              - create
              - get
            - apiGroups:
                - ""
              resources:
                - persistentvolumes
              verbs:
                - get
                - list
                - update
                - watch
            - apiGroups:
                - ""
              resources:
                - endpoints
              verbs:
                - create
                - get
                - list
                - watch
                - update
            - apiGroups:
                - coordination.k8s.io
              resources:
                - leases
              verbs:
                - create
                - get
                - list
                - watch
                - update
            - apiGroups:
                - ""
              resources:
                - serviceaccounts/token
              verbs:
                - create
