

#cloud-config 
package_update: true
package_upgrade: true
users:
- default
- name: admin
  sudo: 'ALL=(ALL) NOPASSWD:ALL'
  shell: /bin/bash
  passwd: '$6$OP$/JmGFNg3rBLcZsxTmq74kuJQwajp9gAl2JXvoyNa7kOR6yrcFXbWdlo0vcWcTN2pZajCegMCG9cSbIVRqdWGD.'
  lock_passwd: false
packages:
- git
- ansible-core
runcmd:
- ansible-pull -U https://github.com/rancherfederal/rke2-ansible.git -i /etc/ansible/inventory/hosts.yml /etc/ansible/playbooks/rke2-install-local.yml
write_files:
- path: /etc/ansible/ansible.cfg
  content: |
    [defaults]
    roles_path = /etc/ansible/roles
    playbook_dir = /etc/ansible/playbooks
- path: /etc/ansible/playbooks/rke2-install-local.yml
  content: |
    ---
    - name: Install RKE2 Server
      hosts:
      - localhost
      roles:
      - role: rke2
- path: /etc/ansible/inventory/hosts.yml
  content: |
    ---
    rke2_cluster:
      children:
        rke2_servers:
          hosts:
            localhost:
              rke2_install_version: v1.33.5+rke2r1
- path: /var/lib/rancher/rke2/server/manifests/post-deploy-manifests/cert-manager.yaml
  content: |
    ---
    apiVersion: helm.cattle.io/v1
    kind: HelmChart
    metadata:
        name: "cert-manager"
        namespace: "kube-system"
        annotations:
            app.kubernetes.io/managed-by: "Helm"
            meta.helm.sh/release-name: "gitops-meta-repo-cluster-gitops-rancher-cluster"
            meta.helm.sh/release-namespace: "kube-system"
        labels:
            app.kubernetes.io/managed-by: "Helm"
            meta.helm.sh/release-name: "gitops-meta-repo-cluster-gitops-rancher-cluster"
            meta.helm.sh/release-namespace: "kube-system"
    spec:
        chart: cert-manager
        repo: "https://charts.jetstack.io"
        targetNamespace: "cert-manager"
        createNamespace: true
        version: "v1.20.2"
        valuesContent: |-
          # Helm chart values which make cert-manager comply with CIS, BSI and NSA
          # security benchmarks and other best practices for deploying cert-manager in
          # production.
          crds:
            enabled: true

          global:
             priorityClassName: system-cluster-critical

          replicaCount: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          automountServiceAccountToken: false
          serviceAccount:
            automountServiceAccountToken: false
          volumes:
          - name: serviceaccount-token
            projected:
              defaultMode: 0444
              sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
              - downwardAPI:
                  items:
                  - path: namespace
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
          volumeMounts:
          - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            name: serviceaccount-token
            readOnly: true

          webhook:
            replicaCount: 3
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
            automountServiceAccountToken: true ## FIXME https://cert-manager.io/docs/installation/best-practice/ recommends this be set false but that fails
            serviceAccount:
              automountServiceAccountToken: true ## FIXME https://cert-manager.io/docs/installation/best-practice/ recommends this be set false but that fails
            volumes:
            - name: serviceaccount-token
              projected:
                defaultMode: 0444
                sources:
                - serviceAccountToken:
                    expirationSeconds: 3607
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
                readOnly: true
          cainjector:
            extraArgs:
            - --namespace=cert-manager
            - --enable-certificates-data-source=false
            replicaCount: 2
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
            automountServiceAccountToken: false
            serviceAccount:
              automountServiceAccountToken: false
            volumes:
            - name: serviceaccount-token
              projected:
                defaultMode: 0444
                sources:
                - serviceAccountToken:
                    expirationSeconds: 3607
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
            volumeMounts:
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: serviceaccount-token
              readOnly: true

          startupapicheck:
            automountServiceAccountToken: false
            serviceAccount:
              automountServiceAccountToken: false
            volumes:
            - name: serviceaccount-token
              projected:
                defaultMode: 0444
                sources:
                - serviceAccountToken:
                    expirationSeconds: 3607
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
            volumeMounts:
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: serviceaccount-token
              readOnly: true

          
- path: /var/lib/rancher/rke2/server/manifests/post-deploy-manifests/rancher.yaml
  content: |
    ---
    apiVersion: helm.cattle.io/v1
    kind: HelmChart
    metadata:
        name: rancher
        namespace: kube-system
        annotations:
            app.kubernetes.io/managed-by: "Helm"
            meta.helm.sh/release-name: "gitops-meta-repo-cluster-gitops-rancher-cluster"
            meta.helm.sh/release-namespace: "kube-system"
        labels:
            app.kubernetes.io/managed-by: "Helm"
            meta.helm.sh/release-name: "gitops-meta-repo-cluster-gitops-rancher-cluster"
            meta.helm.sh/release-namespace: "kube-system"
    spec:
        chart: rancher
        repo: "https://releases.rancher.com/server-charts/stable"
        targetNamespace: cattle-system
        createNamespace: true
        version: "v2.14.2"
        valuesContent: |-
          
          hostname: rancher.yourdomain.com
          bootstrapPassword: admin
          replicas: 3
          ## STIG Configs
          auditLog:
            level: 2
- path: /var/lib/rancher/rke2/server/manifests/post-deploy-manifests/rancher-cluster-gitops.yaml  
  content: |
    
    ---
    apiVersion: fleet.cattle.io/v1alpha1
    kind: GitRepo
    metadata:
      name: gitops-meta-repo
      annotations:
        {}
        #  key: string
      labels:
        {}
        #  key: string
      namespace: fleet-local
    spec:
      branch: "main"
      correctDrift:
        enabled: true
      clientSecretName: "gitops-git-auth"
      paths:
        - cluster-gitops/datacenters/aws/us-east/clusters/cluster-1/cluster
        - cluster-gitops/rancher-cluster/rancher
      repo: "git@github.com:andrew-morris-rgs/rancher-dev-env.git"
      targets:
        - clusterSelector:
            matchExpressions:
              - key: provider.cattle.io
                operator: NotIn
                values:
                  - harvester
