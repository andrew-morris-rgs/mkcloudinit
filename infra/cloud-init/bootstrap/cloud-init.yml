- name: admin
  sudo: ['ALL=(ALL) NOPASSWD:ALL']
  shell: /bin/bash
  passwd: $y$j9T$HhG7s5GIkeybsU3E2ZVw8/$wFpkE0aXyLma.me1ShzTN0VSgbNfGgBWkhqT.BHb0H7
  lock_passwd: false
packages:
- git
- ansible-core
runcmd:
- ansible-pull -U https://github.com/rancherfederal/rke2-ansible.git -i /etc/ansible/inventory/hosts.yml /etc/ansible/playbooks/rke2-install-local.yml
write_files:
- path: /etc/ansible/ansible.cfg
  content: |
    [defaults]
    roles_path = /etc/ansible/roles
    playbook_dir = /etc/ansible/playbooks
- path: /etc/ansible/playbooks/rke2-install-local.yml
  content: |
    ---
    - name: Install RKE2 Server
      hosts:
      - localhost
      roles:
      - role: rke2
- path: /etc/ansible/inventory/hosts.yml
  content: |
    ---
    rke2_cluster:
      children:
        rke2_servers:
          hosts:
            localhost:
              rke2_install_version: v1.32.9-rke2r1
              rke2_registry_config_file_path: /etc/rancher/rke2/registries.yaml
- path: /etc/rancher/rke2/registries.yaml
  content: |
    mirrors:
      true:
        endpoint:
          - https://true/v2
    configs:
      true:
- path: /var/lib/rancher/rke2/server/manifests/post-deploy-manifests/cert-manager.yaml
  content: |
    ---
    apiVersion: helm.cattle.io/v1
    kind: HelmChart
    metadata:
        name: cert-manager
        namespace: kube-system
        annotations:
            app.kubernetes.io/managed-by: "Helm"
            meta.helm.sh/release-name: "gitops-meta-repo-cluster-gitops-rancher-cluster"
            meta.helm.sh/release-namespace: "kube-system"
        labels:
            app.kubernetes.io/managed-by: "Helm"
            meta.helm.sh/release-name: "gitops-meta-repo-cluster-gitops-rancher-cluster"
            meta.helm.sh/release-namespace: "kube-system"
    spec:
        chart: cert-manager
        repo: https://charts.jetstack.io
        targetNamespace: cert-manager
        createNamespace: true
        version: 1.19.1
        valuesContent: |-
          # Helm chart values which make cert-manager comply with CIS, BSI and NSA
          # security benchmarks and other best practices for deploying cert-manager in
          # production.
          crds:
            enabled: true

          global:
             priorityClassName: system-cluster-critical

          replicaCount: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          automountServiceAccountToken: false
          serviceAccount:
            automountServiceAccountToken: false
          volumes:
          - name: serviceaccount-token
            projected:
              defaultMode: 0444
              sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
              - downwardAPI:
                  items:
                  - path: namespace
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
          volumeMounts:
          - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            name: serviceaccount-token
            readOnly: true

          webhook:
            replicaCount: 3
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
            automountServiceAccountToken: true ## FIXME https://cert-manager.io/docs/installation/best-practice/ recommends this be set false but that fails
            serviceAccount:
              automountServiceAccountToken: true ## FIXME https://cert-manager.io/docs/installation/best-practice/ recommends this be set false but that fails
            volumes:
            - name: serviceaccount-token
              projected:
                defaultMode: 0444
                sources:
                - serviceAccountToken:
                    expirationSeconds: 3607
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
              volumeMounts:
              - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                name: serviceaccount-token
                readOnly: true
          cainjector:
            extraArgs:
            - --namespace=cert-manager
            - --enable-certificates-data-source=false
            replicaCount: 2
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
            automountServiceAccountToken: false
            serviceAccount:
              automountServiceAccountToken: false
            volumes:
            - name: serviceaccount-token
              projected:
                defaultMode: 0444
                sources:
                - serviceAccountToken:
                    expirationSeconds: 3607
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
            volumeMounts:
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: serviceaccount-token
              readOnly: true

          startupapicheck:
            automountServiceAccountToken: false
            serviceAccount:
              automountServiceAccountToken: false
            volumes:
            - name: serviceaccount-token
              projected:
                defaultMode: 0444
                sources:
                - serviceAccountToken:
                    expirationSeconds: 3607
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
            volumeMounts:
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: serviceaccount-token
              readOnly: true
          
